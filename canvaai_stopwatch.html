  <script>
    const parts = {
      hours: document.getElementById('hours'),
      minutes: document.getElementById('minutes'),
      seconds: document.getElementById('seconds'),
      milliseconds: document.getElementById('milliseconds')
    };
    const display = document.getElementById('time-display');
    const startButton = document.getElementById('start-button');
    const pauseButton = document.getElementById('pause-button');
    const resetButton = document.getElementById('reset-button');
    const statusArea = document.getElementById('status-area');
    const statuses = ['ready', 'running', 'paused'];
    let elapsed = 0;
    let startedAt = 0;
    let frameId = null;
    let state = 'ready';

    function renderTime(ms) {
      const total = Math.max(0, Math.floor(ms));
      const hours = Math.floor(total / 3600000);
      const minutes = Math.floor(total / 60000) % 60;
      const seconds = Math.floor(total / 1000) % 60;
      const milliseconds = total % 1000;
      parts.hours.textContent = String(hours).padStart(2, '0');
      parts.minutes.textContent = String(minutes).padStart(2, '0');
      parts.seconds.textContent = String(seconds).padStart(2, '0');
      parts.milliseconds.textContent = String(milliseconds).padStart(3, '0');
      display.setAttribute('aria-label', `經過時間：${hours}小時${minutes}分鐘${seconds}秒${milliseconds}毫秒`);
    }

    function setState(next) {
      state = next;
      statuses.forEach(name => {
        document.getElementById(`status-${name}`).classList.toggle('hidden', name !== next);
      });
      statusArea.classList.toggle('running', next === 'running');
      startButton.disabled = next === 'running';
      pauseButton.disabled = next !== 'running';
      resetButton.disabled = next === 'ready';
    }

    function tick(now) {
      if (state !== 'running') return;
      renderTime(elapsed + now - startedAt);
      frameId = requestAnimationFrame(tick);
    }

    startButton.addEventListener('click', () => {
      if (state === 'running') return;
      startedAt = performance.now();
      setState('running');
      frameId = requestAnimationFrame(tick);
    });

    pauseButton.addEventListener('click', () => {
      if (state !== 'running') return;
      elapsed += performance.now() - startedAt;
      cancelAnimationFrame(frameId);
      frameId = null;
      renderTime(elapsed);
      setState('paused');
    });

    resetButton.addEventListener('click', () => {
      if (frameId !== null) cancelAnimationFrame(frameId);
      frameId = null;
      elapsed = 0;
      startedAt = 0;
      renderTime(0);
      setState('ready');
    });

    renderTime(0);
    setState('ready');
  </script>
